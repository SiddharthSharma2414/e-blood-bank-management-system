<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - OneBlood</title>

    <style>

/* ===== NAVBAR ===== */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 40px;

    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);

    z-index: 1000;
}

.logo {
    color: red;
    font-size: 22px;
    font-weight: bold;
    text-decoration: none;
}

.nav-links a {
    padding: 8px 18px;
    border: 2px solid red;
    color: red;
    border-radius: 25px;
    text-decoration: none;
    transition: 0.3s;
}

.nav-links a:hover {
    background: red;
    color: white;
}

/* ===== BODY ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;

    background: linear-gradient(to right, #000000, #050505);
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

/* ===== SINGLE BLOB ===== */
.blob {
    position: absolute;
    width: 350px;
    height: 350px;

    background: radial-gradient(circle, red, transparent);
    filter: blur(120px);

    top: 30%;
    left: 60%;
    transform: translate(-50%, -50%);

    z-index: 0;
}

/* ===== FLOAT ANIMATION ===== */
@keyframes floatBox {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
}

/* ===== LOGIN BOX ===== */
.login-container {
    position: relative;
    z-index: 1;

    width: 320px;
    padding: 30px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);

    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);

    text-align: center;

    animation: floatBox 5s ease-in-out infinite;
}

.login-container h2 {
    color: white;
    margin-bottom: 10px;
}

/* ADMIN NOTE */
.admin-note {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 15px;
}

/* INPUTS */
.login-container input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;

    border: none;
    border-radius: 6px;

    background: rgba(255,255,255,0.08);
    color: white;

    box-sizing: border-box;   /* ✅ FIXES WIDTH ISSUE */
}

/* BUTTON */
.login-container button {
    width: 100%;
    padding: 12px;

    background: linear-gradient(45deg, red, darkred);
    border: none;
    color: white;

    border-radius: 5px;
    cursor: pointer;

    box-sizing: border-box;   /* ✅ IMPORTANT */
}

.login-container button:hover {
    transform: scale(1.05);
}

/* ERROR */
.error {
    color: red;
    font-size: 13px;
    margin-bottom: 10px;
}

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="/" class="logo">🩸 OneBlood</a>

    <div class="nav-links">
        <a href="/">Home</a>
    </div>
</div>

<!-- BACKGROUND BLOB -->
<div class="blob"></div>

<!-- LOGIN BOX -->
<div class="login-container">

    <h2>Admin Login</h2>
    <p class="admin-note">Restricted access — only authorized administrators</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

</div>

</body>
</html>
